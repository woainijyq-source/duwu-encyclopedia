# 奇妙毒物科学游乐园 (Duwu Encyclopedia) static + Curator Voice API snippet
# Included inside crm.truing.top HTTP and HTTPS server blocks via:
#   include /etc/nginx/snippets/duwu-encyclopedia*.conf;

location = /duwu {
    return 301 /duwu/;
}

# 小馆长专属配音录音间云同步 API（存储在 shared-data，发版永不丢失！）
location ^~ /duwu/api/ {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8798/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location = /duwu/manifest.webmanifest {
    alias /www/wwwroot/duwu-encyclopedia/current/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    expires -1;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /duwu/assets/ {
    alias /www/wwwroot/duwu-encyclopedia/current/assets/;
    autoindex off;
    sendfile on;
    etag on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /duwu/ {
    alias /www/wwwroot/duwu-encyclopedia/current/;
    index index.html;
    autoindex off;
    sendfile on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    expires -1;
    add_header X-Content-Type-Options "nosniff" always;
}
